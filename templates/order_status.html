<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Your Order – Masala Kitchen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#c0392b;--gold:#f39c12;--green:#27ae60;--dark:#1a0a00;
  --warm:#fff8f0;--card:#fff;--border:#f0e8e0
}
body{background:var(--warm);font-family:'Segoe UI',system-ui,sans-serif;color:#222;min-height:100vh}

/* Header */
header{background:linear-gradient(135deg,#1a0a00 0%,#3d1c00 100%);color:#fff;
       padding:1rem 1.5rem;display:flex;align-items:center;gap:.75rem;
       box-shadow:0 2px 12px rgba(0,0,0,.3)}
.hdr-brand{display:flex;align-items:center;gap:.6rem;flex:1}
.hdr-icon{width:36px;height:36px;background:var(--gold);border-radius:50%;
          display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.hdr-brand h1{font-size:1rem;font-weight:700;color:#fff}
.hdr-brand p{font-size:.75rem;color:rgba(255,255,255,.6);margin-top:.1rem}
.hdr-back{color:var(--gold);text-decoration:none;font-size:.82rem;font-weight:600;
          padding:.4rem .8rem;border:1px solid rgba(243,156,18,.4);border-radius:6px;
          white-space:nowrap;transition:.15s}
.hdr-back:hover{background:rgba(243,156,18,.15)}

/* Layout */
.page{max-width:580px;margin:0 auto;padding:1.5rem 1rem 3rem}

/* Search card */
.search-card{background:var(--card);border-radius:16px;padding:1.5rem;
             box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:1.5rem}
.search-card h2{font-size:1.05rem;font-weight:700;color:var(--dark);margin-bottom:.3rem}
.search-card p{font-size:.83rem;color:#999;margin-bottom:1rem;line-height:1.5}
.search-row{display:flex;gap:.5rem}
.search-row input{flex:1;padding:.7rem 1rem;border:1.5px solid #e5e5e5;border-radius:10px;
                  font-size:1rem;text-transform:uppercase;letter-spacing:.12em;
                  transition:.2s;font-weight:600;color:var(--dark)}
.search-row input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(192,57,43,.1)}
.search-row button{padding:.7rem 1.3rem;background:var(--red);color:#fff;border:none;
                   border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;
                   transition:.15s;white-space:nowrap}
.search-row button:hover{background:#a93226}

/* Error */
.err-box{background:#fff5f5;border:1px solid #fecaca;color:#c0392b;
         padding:.85rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;display:none}
.err-box.show{display:flex;align-items:center;gap:.5rem}

/* Result panel */
.result{display:none}
.result.show{display:block}

/* Order header card */
.order-head{background:var(--card);border-radius:16px;padding:1.25rem 1.5rem;
            box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:1rem}
.oh-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem}
.oh-id{font-size:1.6rem;font-weight:800;color:var(--red);letter-spacing:.1em;line-height:1}
.oh-type-pill{padding:.3rem .85rem;background:#fff3e0;color:#c0392b;border-radius:20px;
              font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.oh-meta{display:flex;flex-wrap:wrap;gap:.5rem .75rem;font-size:.83rem;color:#666}
.oh-meta span{display:flex;align-items:center;gap:.3rem}
.oh-meta svg{flex-shrink:0;opacity:.7}
.pay-pill{padding:.15rem .55rem;border-radius:4px;font-size:.72rem;font-weight:700}
.pay-pill.paid{background:#dcfce7;color:#15803d}
.pay-pill.pending{background:#fef9c3;color:#a16207}

/* Progress bar */
.progress-wrap{background:var(--card);border-radius:16px;padding:1.25rem 1.5rem;
               box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:1rem}
.progress-label{font-size:.82rem;font-weight:700;color:var(--dark);margin-bottom:.85rem;
                display:flex;justify-content:space-between;align-items:center}
.status-text{font-size:.78rem;padding:.25rem .7rem;border-radius:20px;font-weight:600}
.status-received  .status-text{background:#e0f2fe;color:#0369a1}
.status-preparing .status-text{background:#fef9c3;color:#a16207}
.status-ready     .status-text{background:#dcfce7;color:#15803d}
.status-completed .status-text{background:#f3e8ff;color:#7c3aed}
.status-cancelled .status-text{background:#fee2e2;color:#dc2626}

/* Step dots */
.steps{display:flex;align-items:flex-start;gap:0;position:relative;margin-bottom:1rem}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.step:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;width:100%;
  height:2px;background:#e5e5e5;z-index:0}
.step.done:not(:last-child)::after{background:var(--green)}
.step-dot{width:28px;height:28px;border-radius:50%;border:2.5px solid #ddd;background:#fff;
          display:flex;align-items:center;justify-content:center;font-size:.75rem;
          position:relative;z-index:1;transition:.3s}
.step.done .step-dot{background:var(--green);border-color:var(--green);color:#fff}
.step.active .step-dot{background:var(--gold);border-color:var(--gold);color:#fff;
                        box-shadow:0 0 0 4px rgba(243,156,18,.2);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%[box-shadow:0 0 0 4px rgba(243,156,18,.2)}
                 50%{box-shadow:0 0 0 8px rgba(243,156,18,.05)}}
.step-name{font-size:.68rem;color:#aaa;margin-top:.45rem;text-align:center;font-weight:600;
           line-height:1.2;max-width:60px}
.step.done .step-name{color:var(--green)}
.step.active .step-name{color:var(--gold)}
.step-cancelled .step-dot{background:#dc2626;border-color:#dc2626;color:#fff}
.step-cancelled .step-name{color:#dc2626}

/* Items card */
.items-card{background:var(--card);border-radius:16px;padding:1.25rem 1.5rem;
            box-shadow:0 4px 24px rgba(0,0,0,.07);margin-bottom:1rem}
.items-card h3{font-size:.9rem;font-weight:700;color:var(--dark);margin-bottom:.85rem;
               display:flex;align-items:center;gap:.4rem}
.item-row{display:flex;justify-content:space-between;align-items:center;
          padding:.45rem 0;border-bottom:1px dashed var(--border);font-size:.86rem}
.item-row:last-of-type{border:none}
.item-left{color:#444;line-height:1.3}
.item-left small{color:#aaa;font-size:.75rem;display:block}
.item-price{font-weight:600;color:var(--dark);flex-shrink:0;margin-left:.5rem}
.total-row{display:flex;justify-content:space-between;align-items:center;
           font-weight:700;font-size:1rem;padding-top:.75rem;margin-top:.25rem;
           border-top:2px solid var(--border);color:var(--dark)}

/* Help banner */
.help-banner{background:linear-gradient(135deg,#1a0a00,#3d1c00);border-radius:12px;
             padding:1rem 1.25rem;display:flex;align-items:center;gap:.85rem;color:#fff;
             font-size:.82rem;margin-bottom:1rem}
.help-banner svg{flex-shrink:0;opacity:.8}
.help-banner a{color:var(--gold);text-decoration:none;font-weight:600}

/* Live indicator */
.live-ind{display:flex;align-items:center;gap:.4rem;font-size:.72rem;color:#aaa}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

@media(max-width:480px){
  .page{padding:1rem .75rem 2rem}
  .oh-id{font-size:1.3rem}
}
</style>
</head>
<body>

<header>
  <div class="hdr-brand">
    <div class="hdr-icon">🍛</div>
    <div>
      <h1>Masala Kitchen</h1>
      <p>Order Tracking</p>
    </div>
  </div>
  <a class="hdr-back" href="/">&#8592; Menu</a>
</header>

<div class="page">

  <!-- Search -->
  <div class="search-card">
    <h2>Track Your Order</h2>
    <p>Enter the 6-character order ID shown in your confirmation.</p>
    <div class="search-row">
      <input id="oidInput" type="text" maxlength="6" placeholder="e.g. AB3X7K"
             oninput="this.value=this.value.toUpperCase()"
             onkeydown="if(event.key==='Enter')lookupOrder()">
      <button onclick="lookupOrder()">Track</button>
    </div>
  </div>

  <!-- Error -->
  <div class="err-box" id="errBox">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="errText"></span>
  </div>

  <!-- Result -->
  <div class="result" id="result">

    <!-- Order header -->
    <div class="order-head" id="orderHead">
      <div class="oh-top">
        <div class="oh-id" id="rId"></div>
        <span class="oh-type-pill" id="rType"></span>
      </div>
      <div class="oh-meta" id="rMeta"></div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span>Order Status</span>
        <span class="status-text" id="statusText"></span>
      </div>
      <div class="steps" id="stepsRow"></div>
      <div class="live-ind" id="liveInd" style="display:none">
        <div class="live-dot"></div>
        <span>Auto-refreshing every 15 seconds</span>
      </div>
    </div>

    <!-- Items -->
    <div class="items-card">
      <h3>
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Your Items
      </h3>
      <div id="itemsList"></div>
      <div class="total-row">
        <span>Total Paid</span>
        <span id="rTotal"></span>
      </div>
    </div>

    <!-- Help -->
    <div class="help-banner">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.42 1.21 2 2 0 012.4.02h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.72 6.72l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
      <div>Need help? Call us on <a href="tel:01604123456">01604 123456</a> or email <a href="mailto:info@masakitchen.co.uk">info@masakitchen.co.uk</a></div>
    </div>

  </div><!-- /result -->
</div>

<script>
const STATUS_STEPS = [
  { key:'received',  label:'Received',  icon:'✓' },
  { key:'preparing', label:'Preparing', icon:'🍳' },
  { key:'ready',     label:'Ready',     icon:'✓' },
  { key:'completed', label:'Done',      icon:'✓' },
];
const STATUS_ORDER = ['received','preparing','ready','completed'];

let pollTimer = null;
let currentOid = '';

function lookupOrder() {
  const oid = document.getElementById('oidInput').value.trim().toUpperCase();
  if (oid.length !== 6) { showErr('Please enter a valid 6-character order ID.'); return; }
  currentOid = oid;
  showErr('');
  fetchOrder(oid);
}

function fetchOrder(oid) {
  fetch('/api/order/' + oid)
    .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(data => {
      renderOrder(data);
      clearInterval(pollTimer);
      const active = !['completed','cancelled'].includes(data.status);
      document.getElementById('liveInd').style.display = active ? 'flex' : 'none';
      if (active) pollTimer = setInterval(() => fetchOrder(oid), 15000);
    })
    .catch(() => {
      showErr('order not found. Double-check your order ID and try again.');
      document.getElementById('result').classList.remove('show');
    });
}

function renderOrder(d) {
  // Header
  document.getElementById('rId').textContent = d.id;
  document.getElementById('rType').textContent = d.order_type;

  let dateStr = '';
  try { dateStr = new Date(d.created_at).toLocaleString('en-GB',{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
  catch(e) { dateStr = d.created_at; }

  const payPill = '<span class="pay-pill ' + (d.payment_status==='paid'?'paid':'pending') + '">'
    + (d.payment_status==='paid' ? '✓ Paid' : 'Pay on Arrival') + '</span>';

  document.getElementById('rMeta').innerHTML =
    '<span><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' + esc(d.name) + '</span>' +
    '<span><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>' + dateStr + '</span>' +
    '<span>' + payPill + '</span>';

  // Status class on progress wrap
  const pw = document.getElementById('progressWrap');
  pw.className = 'progress-wrap status-' + d.status;

  // Status text badge
  const labels = {received:'Order Received',preparing:'Being Prepared',ready:'Ready!',completed:'Completed',cancelled:'Cancelled'};
  document.getElementById('statusText').textContent = labels[d.status] || d.status;

  // Steps
  const row = document.getElementById('stepsRow');
  row.innerHTML = '';
  if (d.status === 'cancelled') {
    const div = document.createElement('div');
    div.className = 'step';
    div.innerHTML = '<div class="step-dot step-cancelled" style="background:#dc2626;border-color:#dc2626;color:#fff;width:28px;height:28px;border-radius:50%;border:2.5px solid #dc2626;display:flex;align-items:center;justify-content:center;font-size:.9rem">✕</div><div class="step-name step-cancelled" style="color:#dc2626">Cancelled</div>';
    row.appendChild(div);
  } else {
    const curIdx = STATUS_ORDER.indexOf(d.status);
    STATUS_STEPS.forEach((s, i) => {
      const done   = i <= curIdx;
      const active = i === curIdx;
      const div = document.createElement('div');
      div.className = 'step' + (done?' done':'') + (active?' active':'');
      div.innerHTML = '<div class="step-dot">' + (done?s.icon:'') + '</div><div class="step-name">' + s.label + '</div>';
      row.appendChild(div);
    });
  }

  // Items
  const il = document.getElementById('itemsList');
  il.innerHTML = '';
  (d.items || []).forEach(it => {
    const row = document.createElement('div');
    row.className = 'item-row';
    const opts = [it.spice, it.portion && it.portion!=='Regular'?it.portion:'', it.notes].filter(Boolean).join(' · ');
    row.innerHTML = '<div class="item-left"><span>' + (it.qty||1) + '× ' + esc(it.name) + '</span>' +
      (opts ? '<small>' + esc(opts) + '</small>' : '') + '</div>' +
      '<span class="item-price">£' + ((it.price||0)*(it.qty||1)).toFixed(2) + '</span>';
    il.appendChild(row);
  });
  document.getElementById('rTotal').textContent = '£' + (d.total||0).toFixed(2);

  document.getElementById('result').classList.add('show');
}

function showErr(msg) {
  const box = document.getElementById('errBox');
  document.getElementById('errText').textContent = msg;
  box.className = 'err-box' + (msg ? ' show' : '');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Auto-load from ?id= param
const urlId = new URLSearchParams(location.search).get('id');
if (urlId) {
  document.getElementById('oidInput').value = urlId.toUpperCase().slice(0,6);
  lookupOrder();
}
</script>
</body>
</html>
